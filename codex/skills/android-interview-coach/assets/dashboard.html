<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Прогресс подготовки к Android-собеседованию</title>
  <style>
    :root { color-scheme: light; --ink:#192433; --muted:#68778a; --line:#dce3eb; --surface:#fff; --canvas:#f3f6fa; --accent:#3569d4; --good:#16845b; --warn:#b66a12; }
    * { box-sizing:border-box }
    body { margin:0; background:var(--canvas); color:var(--ink); font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif }
    main { max-width:1040px; margin:0 auto; padding:40px 24px 64px }
    h1 { margin:0 0 6px; font-size:30px; letter-spacing:-.03em }
    h2 { margin:0 0 16px; font-size:19px }
    .subtitle,.muted { color:var(--muted) }
    .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin:28px 0 }
    .card,section { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:20px }
    .metric { font-size:28px; font-weight:700; letter-spacing:-.03em }
    .label { color:var(--muted); font-size:13px }
    section { margin:16px 0 }
    .topic { display:grid; grid-template-columns: minmax(150px,1fr) 2fr 52px; align-items:center; gap:14px; margin:12px 0 }
    progress { width:100%; height:9px; accent-color:var(--accent) }
    table { width:100%; border-collapse:collapse; font-size:14px }
    th,td { text-align:left; padding:11px 9px; border-bottom:1px solid var(--line); vertical-align:top }
    th { color:var(--muted); font-size:12px; font-weight:600 }
    .pill { display:inline-block; padding:2px 9px; border-radius:99px; background:#edf2fa; white-space:nowrap }
    .overdue { color:#a34435; background:#fff0ed }
    @media(max-width:700px) { main{padding:24px 14px}.grid{grid-template-columns:repeat(2,1fr)}.topic{grid-template-columns:1fr 2fr 42px}table{font-size:12px}th,td{padding:8px 4px} }
  </style>
</head>
<body>
<main id="app"></main>
<script>
const data = __PROGRESS_DATA__;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const attempts = data.attempts || [];
const unique = new Set(attempts.map(a => a.question_id));
const due = Object.entries(data.questions || {}).filter(([,q]) => q.next_review && new Date(q.next_review) <= new Date()).length;
const avg = attempts.length ? (attempts.reduce((n,a) => n + Number(a.score || 0),0)/attempts.length).toFixed(1) : '—';
const topicRows = Object.entries(data.topics || {}).sort((a,b) => a[0].localeCompare(b[0],'ru')).map(([name,t]) => `<div class="topic"><strong>${esc(name)}</strong><progress max="100" value="${Math.max(0,Math.min(100,Number(t.readiness || 0)))}"></progress><span>${Math.round(Number(t.readiness || 0))}%</span></div>`).join('') || '<p class="muted">Пока нет данных по темам.</p>';
const recent = [...attempts].sort((a,b) => new Date(b.asked_at)-new Date(a.asked_at)).slice(0,20).map(a => `<tr><td>${new Date(a.asked_at).toLocaleString('ru-RU')}</td><td>${esc(a.question_id)}</td><td>${esc(a.topic)}</td><td>${esc(a.score)}/4</td><td>${esc(a.note)}</td></tr>`).join('');
const dueRows = Object.entries(data.questions || {}).filter(([,q]) => q.next_review).sort((a,b) => new Date(a[1].next_review)-new Date(b[1].next_review)).slice(0,30).map(([id,q]) => `<tr><td>${esc(id)}</td><td>${esc(q.topic)}</td><td><span class="pill ${new Date(q.next_review)<=new Date()?'overdue':''}">${new Date(q.next_review).toLocaleDateString('ru-RU')}</span></td><td>${esc(q.last_score ?? '—')}/4</td></tr>`).join('');
document.querySelector('#app').innerHTML = `<h1>Подготовка к Android-собеседованию</h1><div class="subtitle">Обновлено ${new Date().toLocaleString('ru-RU')}</div><div class="grid"><div class="card"><div class="metric">${unique.size}</div><div class="label">вопросов изучено</div></div><div class="card"><div class="metric">${attempts.length}</div><div class="label">попыток</div></div><div class="card"><div class="metric">${avg}</div><div class="label">средняя оценка из 4</div></div><div class="card"><div class="metric">${due}</div><div class="label">пора повторить</div></div></div><section><h2>Готовность по темам</h2>${topicRows}</section><section><h2>Повторение</h2>${dueRows?`<table><thead><tr><th>Вопрос</th><th>Тема</th><th>Повторить</th><th>Последняя оценка</th></tr></thead><tbody>${dueRows}</tbody></table>`:'<p class="muted">Расписание повторений появится после первых ответов.</p>'}</section><section><h2>Последние ответы</h2>${recent?`<table><thead><tr><th>Когда</th><th>ID вопроса</th><th>Тема</th><th>Оценка</th><th>Комментарий</th></tr></thead><tbody>${recent}</tbody></table>`:'<p class="muted">Попыток пока нет.</p>'}</section>`;
</script>
</body>
</html>
